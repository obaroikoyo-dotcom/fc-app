<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
</head>
<body bgcolor="#0a0a0a" style="margin:0;padding:0;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0a0a0a" style="background:#0a0a0a;">
    <tr>
      <td align="center" bgcolor="#0a0a0a" style="background:#0a0a0a;padding:48px 24px;">
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td align="center" style="padding-bottom:40px;">
              <table cellpadding="0" cellspacing="0" border="0" style="margin:0 auto 10px auto;">
                <tr>
                  <td bgcolor="#1a1a1a" style="background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:12px 16px;">
                    <img src="https://otbcvpgtxxidgtbxgzpo.supabase.co/storage/v1/object/public/assets/my_logo-removebg-preview.png" alt="FlipCollab" height="40" style="display:block;width:auto;">
                  </td>
                </tr>
              </table>
              <span style="font-size:18px;font-weight:700;color:#ffffff;letter-spacing:-0.02em;display:block;">FlipCollab</span>
            </td>
          </tr>
          <tr>
            <td bgcolor="#111111" style="background:#111111;border:1px solid #1a1a1a;border-radius:16px;padding:40px 32px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-bottom:20px;">
                    <span style="font-size:10px;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:#888888;">Account Verification</span>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:24px;">
                    <div style="height:1px;background:#1a1a1a;"></div>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:12px;">
                    <p style="margin:0;font-size:24px;font-weight:700;color:#ffffff;line-height:1.2;">We sent you a code.</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:32px;">
                    <p style="margin:0;font-size:14px;color:#aaaaaa;line-height:1.7;">Enter this code in the app to verify your email and activate your FlipCollab account.</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:32px;">
                    <div style="background:#0a0a0a;border:1px solid #333;border-radius:12px;padding:24px;text-align:center;">
                      <span style="font-size:36px;font-weight:700;color:#ffffff;letter-spacing:0.2em;">{{ .Token }}</span>
                    </div>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom:24px;">
                    <div style="height:1px;background:#1a1a1a;"></div>
                  </td>
                </tr>
                <tr>
                  <td>
                    <p style="margin:0;font-size:12px;color:#888888;line-height:1.6;">This code expires in 60 minutes. If you didn't create a FlipCollab account, you can safely ignore this email.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="margin:0;font-size:11px;color:#666666;">© FlipCollab. All rights reserved.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
