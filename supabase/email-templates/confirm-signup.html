<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:'DM Sans',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px 28px;">

          <tr>
            <td align="center" style="padding-bottom:12px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" valign="middle" width="56" height="56" style="width:56px;height:56px;background:#0a0a0a;border-radius:12px;">
                    <img src="https://flipcollab.com/logo.png" width="34" height="34" alt="FlipCollab" style="display:block;margin:0 auto;border:0;">
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="font-family:'Syne',Helvetica,Arial,sans-serif;font-size:18px;font-weight:800;color:#0a0a0a;padding-bottom:24px;">FlipCollab</td>
          </tr>

          <tr>
            <td style="font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:#777;padding-bottom:12px;">Account verification</td>
          </tr>
          <tr>
            <td style="font-size:22px;font-weight:700;color:#0a0a0a;padding-bottom:10px;">Your verification code</td>
          </tr>
          <tr>
            <td style="font-size:14px;line-height:1.5;color:#444;padding-bottom:24px;">Enter this code in the app to verify your email and activate your FlipCollab account.</td>
          </tr>

          <tr>
            <td align="center" style="background:#0a0a0a;border-radius:12px;padding:20px;font-family:'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:0.3em;color:#ffffff;">{{ .Token }}</td>
          </tr>

          <tr>
            <td style="font-size:12px;line-height:1.5;color:#777;padding-top:24px;border-top:1px solid #eee;margin-top:24px;">This code expires in 60 minutes. If you didn't create a FlipCollab account, you can safely ignore this email.</td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
